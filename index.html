<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Himnario Digital</title>
  <meta name="theme-color" content="#111113" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="content-grid">
      <section id="hymnIndexPanel" class="panel hymn-index-panel">
        <div class="panel-head index-head">
          <div class="index-head-top">
            <h2>Índice</h2>

            <button id="themeToggleIndex" class="theme-toggle index-theme-toggle" type="button" aria-label="Cambiar tema">
              ◐
            </button>
          </div>

          <div class="search-wrapper index-search-wrapper">
            <label class="sr-only" for="searchInput">Buscar himno</label>
            <input id="searchInput" type="text" placeholder="Buscar palabra, número o título..." autocomplete="off" inputmode="search" />

            <button id="clearSearch" class="clear-search" type="button" aria-label="Limpiar búsqueda">
              ×
            </button>
          </div>
        </div>

        <div id="hymnList" class="hymn-list"></div>
      </section>

      <section id="hymnDetailPanel" class="panel hymn-detail-panel hidden">
        <div id="hymnDetail" class="hymn-detail"></div>
      </section>
    </section>
  </main>
</body>
</html>
