<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Himnario Digital</title>
  <meta name="theme-color" content="#007aff" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="app-shell">

    <section id="searchPanel" class="search-panel" aria-label="Búsqueda de himnos">
      <label class="sr-only" for="searchInput">Buscar himno</label>

      <div class="search-wrapper">
        <input id="searchInput" type="text" placeholder="Buscar palabra, número o título..." autocomplete="off" inputmode="search" />

        <button id="clearSearch" class="clear-search" type="button" aria-label="Limpiar búsqueda">
          ×
        </button>
      </div>

      <div id="resultCount" class="result-count">Cargando himnos…</div>
    </section>

    <section class="content-grid">
      <section id="hymnIndexPanel" class="panel">
        <div class="panel-head">
          <h2>Índice</h2>
        </div>
        <div id="hymnList" class="hymn-list"></div>
      </section>

      <section id="hymnDetailPanel" class="panel hymn-detail-panel hidden">
        <div id="hymnDetail" class="hymn-detail"></div>
      </section>
    </section>
  </main>
</body>
</html>
